name: Build and Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, Clippy and Python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality
          cache-on-failure: true
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Headless benchmark check
        run: cargo check --locked --no-default-features --bin omr-benchmark
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Python tests
        run: python -m unittest discover -s scripts -p "test_*.py"

  check:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.os == 'windows-11-arm' && 'stable-aarch64-pc-windows-msvc' || 'stable' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: optimized-tests
          cache-on-failure: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Compile Rust tests
        timeout-minutes: 30
        run: cargo test --profile ci --locked --no-run
      - name: Run Rust tests
        timeout-minutes: 10
        run: cargo test --profile ci --locked
      - name: Build binaries
        run: cargo build --profile ci --locked
      - uses: actions/setup-python@v7
        if: github.ref_type != 'tag'
        with:
          python-version: '3.x'
      - name: Package development build
        if: github.ref_type != 'tag'
        run: python scripts/package_release.py --profile ci
      - name: Upload development build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: libreomr-dev-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
